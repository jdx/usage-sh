name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs. A mutable tag like @v5 can be
# retargeted at any time, which would swap out executable CI code without
# review.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs node and aube at the versions pinned in mise.toml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # postinstall runs `wrangler types`, which generates
      # worker-configuration.d.ts. That file is derived from wrangler.jsonc and
      # would drift silently if committed, so it is generated instead.
      - run: aube ci

      - run: aube exec astro check
      - run: aube run build

  # Single fan-in gate, so branch protection requires one check instead of an
  # enumerated list that goes stale every time a job is added or renamed. It
  # also catches *skipped* jobs, which a required check would otherwise treat
  # as passing.
  final:
    permissions: {}
    needs:
      - check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    # Run on success or upstream failure but skip when the workflow is cancelled
    # — `always()` would override `cancel-in-progress` and waste a runner.
    if: ${{ !cancelled() }}
    steps:
      - name: Check job results
        if: needs.check.result != 'success'
        run: exit 1
      - run: echo "All CI jobs completed successfully"

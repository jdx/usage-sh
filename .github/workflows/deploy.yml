name: deploy

# Deployment happens only from CI. No Cloudflare credentials exist outside this
# workflow's secrets, and nobody deploys usage.sh from a laptop.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "astro.config.mjs"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Fail before touching Cloudflare if the source does not typecheck.
      - run: npx astro check

      - run: npm run build

      # The usage.sh custom domain is attached by hand in the dashboard, so this
      # token only needs Workers Scripts:Edit — no Zone:DNS:Edit. Wrangler leaves
      # routes it does not declare alone, so the binding survives each deploy.
      - name: Deploy to Cloudflare Workers
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare deployment failed after $attempt attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Deploy attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # After the code, so a migration never lands for a version that failed to
      # deploy. wrangler tracks applied files in a d1_migrations table, so this
      # is a no-op when there is nothing new. Needs D1:Edit on the token.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply usage-sh --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # usage.sh is attached, so a bad deploy should fail the run rather than
      # quietly serving errors.
      - name: Smoke test
        run: |
          set -e
          fail=0
          check() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
              --retry-all-errors "https://usage.sh$1" || echo 000)
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ] || fail=1
          }
          check / 200
          check /gh/jdx/tak 200
          check /gh/nope-xyz-999/nope 404
          [ "$fail" = "0" ] || { echo "::error::smoke test failed"; exit 1; }

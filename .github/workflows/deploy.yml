name: deploy

# Deployment happens only from CI. Nobody deploys usage.sh from a laptop, and no
# Cloudflare credentials exist outside this workflow's secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Fail before touching Cloudflare if the source does not compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # First deploy also claims the usage.sh custom domain, which rewrites the
      # zone's DNS. The token therefore needs Zone:DNS:Edit on usage.sh in
      # addition to Workers Scripts:Edit.
      - name: Deploy to Cloudflare Workers
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cloudflare deployment failed after $attempt attempts"
              exit 1
            fi
            delay=$((attempt * 15))
            echo "::warning::Deploy attempt $attempt failed; retrying in ${delay}s"
            sleep "$delay"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          set -e
          for path in / /health /gh/jdx/tak; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 \
              --retry-all-errors "https://usage.sh$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
